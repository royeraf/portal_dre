; Sube el límite de subida de archivos para la sección "Archivos" del gestor
; (la regla de validación de Laravel ya permite 10 MB, pero PHP cortaba antes en 2 MB).
;
; upload_max_filesize va por ENCIMA de los 10 MB que valida Laravel (ArchivoController,
; regla "max:10240") a propósito: si PHP cortara justo en 10 MB, un archivo de 10-12 MB
; se rechazaría con el mensaje genérico de PHP ("El campo file no se pudo subir") en vez
; del mensaje real de Laravel ("El archivo no debe superar los 10 MB"). Dejando margen,
; PHP deja pasar el archivo y es la regla de Laravel la que aplica el límite y explica por qué.
;
; post_max_size va por encima de upload_max_filesize porque el POST incluye,
; además del archivo, los demás campos del formulario y el overhead del multipart.
upload_max_filesize = 12M
post_max_size = 13M
